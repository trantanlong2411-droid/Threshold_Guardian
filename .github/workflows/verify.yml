name: Threshold Guardian - tests and live Pharos MCP proof
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
  live-pharos-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Real Pharos Mainnet read - expected FIRE
        run: npm run fire
      - name: Real Pharos Mainnet read - expected HOLD
        run: npm run hold
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threshold-guardian-pharos-mcp-evidence
          path: proof/*.json
          if-no-files-found: warn
