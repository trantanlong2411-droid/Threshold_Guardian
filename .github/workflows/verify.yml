name: Threshold Guardian - tests and live Pharos MCP proof
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-worker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Ten offline logic and MCP parser tests
        run: npm test
      - name: Verify Cloudflare Worker bundle (no deployment)
        run: npx wrangler deploy --dry-run --outdir ./worker-bundle
  live-pharos-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Real Pharos Mainnet read - expected FIRE
        run: npm run fire
      - name: Real Pharos Mainnet read - expected HOLD
        run: npm run hold
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threshold-guardian-pharos-mcp-evidence
          path: proof/*.json
          if-no-files-found: warn
  deployed-website-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public Workers page, health and actual deployed FIRE / HOLD
        run: node scripts/smoke-deployed.mjs

  linked-worker-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Git-connected threshold-guardian Worker using real MCP
        env:
          GUARDIAN_BASE_URL: https://threshold-guardian.trantanlong2411.workers.dev
        run: node scripts/smoke-deployed.mjs
